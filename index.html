<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Hospedaje</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    background:white;
    width:90%;
    max-width:450px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#003366;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#0d5db8;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#084b95;
}

#resultado{
    margin-top:20px;
}

.info{
    background:#eef5ff;
    padding:15px;
    border-radius:10px;
}

.nombre{
    font-size:22px;
    font-weight:bold;
    color:#003366;
}

.hotel{
    margin-top:10px;
    font-size:18px;
    color:green;
}

.error{
    color:red;
    text-align:center;
}
</style>
</head>
<body>

<div class="card">

    <h1>Consulta de Hospedaje</h1>

    <input
        type="text"
        id="ci"
        placeholder="Ingrese su CI">

    <button onclick="buscar()">
        Consultar
    </button>

    <div id="resultado"></div>

</div>

<script>

let datos = [];

fetch("hospedajes.csv")
.then(response => response.text())
.then(text => {

    const filas = text.split(/\r?\n/);

    filas.forEach(fila => {

        const columnas = fila.split(";");

        if(columnas.length < 5) return;

        let funcionario = columnas[2]?.trim();
        let alojamiento = columnas[3]?.trim();
        let ci = columnas[4]?.replace(/\D/g,'');

        if(!funcionario || !ci) return;

        datos.push({
            funcionario,
            alojamiento,
            ci
        });

    });

    console.log("Registros cargados:", datos.length);
});

function buscar(){

    const ciBuscado = document
        .getElementById("ci")
        .value
        .replace(/\D/g,'')
        .trim();

    const persona = datos.find(
        x => x.ci === ciBuscado
    );

    const resultado =
        document.getElementById("resultado");

    if(persona){

        resultado.innerHTML = `
            <div class="info">
                <div class="nombre">
                    ${persona.funcionario}
                </div>

                <div class="hotel">
                    Hospedaje: ${persona.alojamiento}
                </div>
            </div>
        `;

    }else{

        resultado.innerHTML = `
            <p class="error">
                No se encontró información para el CI ingresado.
            </p>
        `;
    }
}

document.getElementById("ci")
.addEventListener("keypress",function(e){
    if(e.key === "Enter"){
        buscar();
    }
});

</script>

</body>
</html>
